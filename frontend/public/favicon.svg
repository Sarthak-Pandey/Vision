<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Accent Gradient (Electric Cobalt Blue) -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="40%" stop-color="#3D81E3" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- White Sector 1 Gradient -->
    <linearGradient id="whiteGrad1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- White Sector 2 Gradient -->
    <linearGradient id="whiteGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- White Sector 3 Gradient -->
    <linearGradient id="whiteGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="burstGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3D81E3" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#3D81E3" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow Behind -->
  <circle cx="256" cy="256" r="220" fill="url(#burstGlow)" />

  <!-- 4 Burst Sectors -->
  <!-- Top-Right: Accent Blue Sector (Slightly further burst) -->
  <g transform="translate(14, -14)">
    <path d="M 256 196
             A 176 176 0 0 1 432 256
             L 348 256
             A 92 92 0 0 0 256 164
             Z"
          fill="url(#blueGrad)"
          filter="url(#glow)" />
  </g>

  <!-- Top-Left: White Sector -->
  <g transform="translate(-10, -10)">
    <path d="M 256 80
             A 176 176 0 0 0 80 256
             L 164 256
             A 92 92 0 0 1 256 164
             Z"
          fill="url(#whiteGrad1)" />
  </g>

  <!-- Bottom-Left: White Sector -->
  <g transform="translate(-10, 10)">
    <path d="M 80 256
             A 176 176 0 0 0 256 432
             L 256 348
             A 92 92 0 0 1 164 256
             Z"
          fill="url(#whiteGrad2)" />
  </g>

  <!-- Bottom-Right: White Sector -->
  <g transform="translate(10, 10)">
    <path d="M 256 432
             A 176 176 0 0 0 432 256
             L 348 256
             A 92 92 0 0 1 256 348
             Z"
          fill="url(#whiteGrad3)" />
  </g>

  <!-- Center Floating Core Dot -->
  <circle cx="256" cy="256" r="16" fill="#3D81E3" filter="url(#glow)" />
  <circle cx="256" cy="256" r="10" fill="#FFFFFF" />
</svg>